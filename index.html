<head>

  <meta charset="UTF-8" />

  <!-- Primary Meta Tags -->
  <title>KitVault.io — Track. Build. Complete.</title>
  <meta name="description"
    content="Track your Gunpla builds, browse assembly manuals, and manage your kit collection. Free build tracker and manual database for HG, MG, RG, PG, SD, EG, and MGSD Gundam model kits. Community-driven." />
  <meta name="keywords"
    content="gunpla, gundam, model kit, build tracker, gunpla tracker, assembly manual, instruction manual, HG, MG, RG, PG, SD, EG, MGSD, bandai, gundam manual, gunpla manual, gunpla instructions, gundam instructions, kitvault, gunpla progress, kit collection" />
  <meta name="author" content="KitVault.io" />
  <meta name="robots" content="index, follow" />

  <!-- css reliability-->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap">

  <!-- Canonical -->
  <link rel="canonical" href="https://kitvault.io/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kitvault.io/" />
  <meta property="og:title" content="KitVault.io — Track. Build. Complete." />
  <meta property="og:description"
    content="Track your Gunpla builds, browse assembly manuals, and manage your kit collection. Free & community-driven." />
  <meta property="og:site_name" content="KitVault.io" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KitVault.io — Track. Build. Complete." />
  <meta name="twitter:description"
    content="Track your Gunpla builds, browse assembly manuals, and manage your kit collection. Free & community-driven." />
  <!-- <meta name="twitter:image" content="https://kitvault.io/og-image.png" /> -->

  <!-- Theme -->
  <meta name="theme-color" content="#060d18" />
  <meta name="color-scheme" content="dark" />

  <!-- Favicons (add your own files) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Preconnect to external services -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />

  <!-- Structured Data: WebSite (enables sitelinks search box) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "KitVault.io",
    "alternateName": "KitVault",
    "url": "https://kitvault.io",
    "description": "Track your Gunpla builds, browse assembly manuals, and manage your kit collection. Free build tracker for Gundam model kits.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://kitvault.io/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "KitVault.io",
    "url": "https://kitvault.io",
    "logo": "https://kitvault.io/favicon.svg",
    "description": "Free Gunpla build tracker, manual database, and community resource for Gundam model builders."
  }
  </script>

  <!-- Structured Data: CollectionPage (for the kit library) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Gunpla Kit Library",
    "description": "Browse assembly manuals and track builds for hundreds of Gundam model kits across all grades: HG, MG, RG, PG, SD, EG, and MGSD.",
    "url": "https://kitvault.io/",
    "isPartOf": {
      "@type": "WebSite",
      "name": "KitVault.io"
    }
  }
  </script>
</head>
